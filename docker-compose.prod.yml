# Production stack: Next.js app + Postgres + hourly database backups.
# Media and backups live in Cloudflare R2 (docs/deploy/cloudflare-r2.md,
# docs/deploy/db-backups.md); there is no local object storage.
# All services run in HOST network mode — they reach each other via 127.0.0.1.
# Operator MUST firewall ports 5000 and 5432 from public (and 3900-3904 while an
# old Garage container from before the R2 move is still running).
# Only Nginx (manual on host) should expose 80/443.

#
# Two app instances (app, app2) use both CPU cores; Nginx balances between
# them (docs/deploy/nginx-two-instances.md). They share one data cache in Redis
# (ADR 0005), so an admin save on either clears it for both.

x-app: &app
  image: ecommerce-website:latest
  restart: unless-stopped
  network_mode: host
  env_file:
    - .env.production
  depends_on:
    - postgres
    - redis

# Shared by both instances; `environment` wins over .env.production.
x-app-env: &app-env
  # Listen on loopback only, so 5001/5002 can't be reached from the internet
  # (that would skip Cloudflare and Nginx, and with them the real-IP rate limits).
  # Not HOSTNAME=127.0.0.1: Next builds its internal middleware URLs with
  # "localhost" and compares them with the hostname it was given, so 127.0.0.1
  # makes every next-intl rewrite look external and pages 307-loop. "localhost"
  # matches; ipv4first makes Node resolve it to 127.0.0.1 (not ::1), where
  # Nginx connects.
  HOSTNAME: localhost
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  REDIS_URL: redis://127.0.0.1:6379
  # 2 instances x 8 = 16 of Postgres' 30 connections.
  DB_POOL_MAX: "8"

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    environment:
      <<: *app-env
      PORT: "5001"

  app2:
    <<: *app
    container_name: ecommerce-app2
    environment:
      <<: *app-env
      PORT: "5002"

  # Visit tracker (ADR 0006): answers POST /api/track without Next.js. Same image,
  # its own small Node server on loopback; Nginx falls back to the app if it's down.
  tracker:
    image: ecommerce-website:latest
    container_name: ecommerce-tracker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.production
    environment:
      TRACKER_PORT: "5003"
    command: ["node", "tracker/server.mjs"]
    depends_on:
      - postgres

  # Cache only: no disk persistence. Entries have a TTL and `volatile-lru` evicts
  # only those, never the tag-expiry hash (which has no TTL).
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    network_mode: host
    command:
      - "redis-server"
      - "--bind"
      - "127.0.0.1"
      - "--port"
      - "6379"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "volatile-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=127.0.0.1"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-backup:
    build:
      context: docker/db-backup
    image: ecommerce-db-backup:latest
    container_name: ecommerce-db-backup
    restart: unless-stopped
    network_mode: host
    # Its own env file: the backup token never reaches the app, and app secrets
    # never reach this container (docs/deploy/db-backups.md).
    env_file:
      - .env.backup
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ecommerce
      PGPASSWORD: ecommerce
      PGDATABASE: ecommerce
      TZ: Asia/Dhaka
    volumes:
      - db_backup_state:/var/lib/db-backup
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  db_backup_state:
